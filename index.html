<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1769a4">
  <meta name="description" content="GO-style docentportaal demo voor GitHub Pages">
  <title>GO Docentportaal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-shell" data-theme="light">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="brand" type="button" data-action="home" aria-label="Naar start">
          <span class="brand-logo">GO</span>
          <span class="brand-text"><b>GO</b><small>Docentomgeving</small></span>
        </button>

        <button class="location-switcher" id="locationSwitcher" type="button">
          <span class="location-icon" data-icon="school"></span>
          <span class="location-copy"><small>Locatie</small><b id="locationLabel">De Horizon</b></span>
          <span class="chevron" data-icon="chevron-down"></span>
        </button>

        <button class="profile" id="profileButton" type="button">
          <span class="avatar avatar-lg">LD</span>
          <span class="profile-copy"><b>Levi Docent</b><small>Leerkracht</small></span>
          <span class="chevron" data-icon="chevron-down"></span>
        </button>
      </div>

      <div class="group-block">
        <span class="group-caption">Actieve groep</span>
        <button class="group-switcher" id="groupSwitcher" type="button">
          <span class="group-avatar">8A</span>
          <span class="group-copy"><b id="groupLabel">Groep 8A</b><small id="groupMeta">24 leerlingen</small></span>
          <span class="chevron" data-icon="chevron-down"></span>
        </button>
      </div>

      <nav class="nav" aria-label="Hoofdnavigatie">
        <button class="nav-item active" data-route="my-apps" type="button"><span data-icon="grid"></span><span class="nav-label">Mijn applicaties</span></button>
        <button class="nav-item" data-route="group-apps" type="button"><span data-icon="users"></span><span class="nav-label">Groepsapplicaties</span></button>
        <button class="nav-item" data-route="tasks" type="button"><span data-icon="check-square"></span><span class="nav-label">Taken</span><span class="nav-badge" id="taskCount">3</span></button>
        <button class="nav-item" data-route="classroom" type="button"><span data-icon="monitor"></span><span class="nav-label">Klassenmanagement</span><span class="online-dot" title="Klassenmanagement actief"></span></button>
        <button class="nav-item" data-route="library" type="button"><span data-icon="library"></span><span class="nav-label">Bibliotheek</span></button>
      </nav>

      <div class="sidebar-grow"></div>

      <nav class="nav nav-secondary" aria-label="Extra navigatie">
        <button class="nav-item" data-route="notifications" type="button"><span data-icon="bell"></span><span class="nav-label">Meldingen</span><span class="nav-badge soft" id="notificationCount">4</span></button>
        <button class="nav-item" data-route="settings" type="button"><span data-icon="settings"></span><span class="nav-label">Instellingen</span></button>
        <button class="nav-item" data-route="help" type="button"><span data-icon="help-circle"></span><span class="nav-label">Help & informatie</span></button>
      </nav>

      <button class="collapse-sidebar" id="collapseSidebar" type="button"><span data-icon="panel-left-close"></span><span class="nav-label">Navigatie inklappen</span></button>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Menu openen"><span data-icon="menu"></span></button>
          <div class="breadcrumbs" id="breadcrumbs"><span>GO</span><span>/</span><b>Mijn applicaties</b></div>
        </div>
        <div class="topbar-right">
          <label class="global-search"><span data-icon="search"></span><input id="globalSearch" type="search" placeholder="Zoek in GO" autocomplete="off"><kbd>/</kbd></label>
          <button class="top-icon" id="quickCreate" type="button" title="Nieuw"><span data-icon="plus"></span></button>
          <button class="top-icon" id="notificationButton" type="button" title="Meldingen"><span data-icon="bell"></span><i class="notification-indicator"></i></button>
          <button class="top-avatar" id="topProfile" type="button"><span class="avatar">LD</span></button>
        </div>
      </header>

      <main id="main" class="main" tabindex="-1">
        <section class="page-loading" id="pageLoading" hidden>
          <div class="skeleton title"></div><div class="skeleton line"></div><div class="skeleton-grid"><div></div><div></div><div></div><div></div></div>
        </section>
        <div id="page"></div>
      </main>
    </div>
  </div>

  <div class="drawer-layer" id="drawerLayer" aria-hidden="true">
    <div class="drawer-scrim" data-close-drawer></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true">
      <header class="drawer-header"><div><span class="eyebrow" id="drawerEyebrow">GO</span><h2 id="drawerTitle">Paneel</h2></div><button class="icon-button" type="button" data-close-drawer><span data-icon="x"></span></button></header>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>

  <div class="modal-layer" id="modalLayer" aria-hidden="true">
    <div class="modal-scrim" data-close-modal></div>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header"><div><span class="eyebrow" id="modalEyebrow">GO</span><h2 id="modalTitle">Venster</h2></div><button class="icon-button" type="button" data-close-modal><span data-icon="x"></span></button></header>
      <div class="modal-body" id="modalBody"></div>
    </section>
  </div>

  <div class="context-menu" id="contextMenu" hidden></div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <div class="command-palette" id="commandPalette" hidden>
    <div class="command-box"><div class="command-input"><span data-icon="search"></span><input id="commandInput" placeholder="Ga naar of zoek..." autocomplete="off"><kbd>Esc</kbd></div><div id="commandResults" class="command-results"></div></div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
